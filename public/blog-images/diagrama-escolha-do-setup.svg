<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1370" viewBox="0 0 720 1370" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo de decisão para escolher um setup inicial de produção musical</title>
  <desc id="desc">Três caminhos independentes: produção só no computador, gravação de voz ou instrumento e composição com controlador MIDI.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#2dd4bf"/></marker>
    <style>
      .title{font-family:Arial,sans-serif;font-size:28px;font-weight:700;letter-spacing:.03em;fill:#e8eef6}.question{font-family:Arial,sans-serif;font-size:28px;font-weight:700;fill:#e8eef6}.heading{font-family:Arial,sans-serif;font-size:27px;font-weight:700;fill:#e8eef6}.detail{font-family:Arial,sans-serif;font-size:20px;font-weight:400;fill:#9bacc2}.tag{font-family:Arial,sans-serif;font-size:18px;font-weight:700;fill:#2dd4bf;letter-spacing:.05em}.box{fill:#111827;stroke:#34445c;stroke-width:2}.choice{fill:#0f2727;stroke:#2dd4bf;stroke-width:2}.line{fill:none;stroke:#2dd4bf;stroke-width:4;marker-end:url(#arrow)}.divider{stroke:#253147;stroke-width:2}
    </style>
  </defs>
  <rect width="720" height="1370" rx="28" fill="#0a0e14"/>
  <text x="44" y="56" class="title">QUAL SETUP FAZ SENTIDO?</text>
  <text x="44" y="89" class="detail">Escolha o caminho que corresponde ao seu objetivo.</text>

  <text x="60" y="158" class="tag">CAMINHO 1 · PRODUÇÃO VIRTUAL</text>
  <rect x="60" y="180" width="600" height="125" rx="20" class="box"/>
  <text x="92" y="225" class="question">Loops e instrumentos virtuais</text><text x="92" y="267" class="detail">Sem gravar fontes externas por enquanto</text>
  <path d="M360 305v48" class="line"/>
  <rect x="60" y="365" width="600" height="140" rx="20" class="choice"/>
  <text x="92" y="405" class="tag">COMECE COM</text><text x="92" y="448" class="heading">Computador + DAW + fones</text><text x="92" y="483" class="detail">A interface pode esperar.</text>

  <line x1="60" y1="555" x2="660" y2="555" class="divider"/>
  <text x="60" y="615" class="tag">CAMINHO 2 · GRAVAÇÃO</text>
  <rect x="60" y="637" width="600" height="125" rx="20" class="box"/>
  <text x="92" y="682" class="question">Voz ou instrumento real</text><text x="92" y="724" class="detail">Uma fonte sonora entrando no projeto</text>
  <path d="M360 762v48" class="line"/>
  <rect x="60" y="822" width="600" height="155" rx="20" class="choice"/>
  <text x="92" y="862" class="tag">ADICIONE</text><text x="92" y="905" class="heading">Interface + entrada adequada</text><text x="92" y="942" class="detail">Microfone ou cabo/DI + fone fechado.</text>

  <line x1="60" y1="1027" x2="660" y2="1027" class="divider"/>
  <text x="60" y="1087" class="tag">CAMINHO 3 · COMPOSIÇÃO</text>
  <rect x="60" y="1109" width="600" height="105" rx="20" class="box"/>
  <text x="92" y="1153" class="question">Tocar acordes, linhas e timbres</text>
  <path d="M360 1214v40" class="line"/>
  <rect x="60" y="1266" width="600" height="82" rx="20" class="choice"/>
  <text x="92" y="1302" class="tag">ADICIONE</text><text x="92" y="1332" class="heading">Base + controlador MIDI</text>
</svg>
