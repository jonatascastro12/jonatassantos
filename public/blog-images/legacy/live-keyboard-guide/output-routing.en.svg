<svg xmlns="http://www.w3.org/2000/svg" width="720" height="916" viewBox="0 0 720 916" lang="en" role="img" aria-labelledby="title desc">
<title id="title">Who hears the click?</title>
<desc id="desc">A stereo mix without click uses outputs 1/2 for the mixer and audience. A stereo mix with instruments and click uses outputs 3/4 for the performers headphone amp or in-ear system.</desc>
<defs>
<marker id="midi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#55deca"/></marker>
<marker id="audio" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#ffbd7a"/></marker>
</defs>
<rect width="720" height="916" rx="24" fill="#0b1620"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="40" y="63" fill="#f1f6f7" font-size="40" font-weight="700" text-anchor="start">Who hears the click?</text><text x="40" y="107" fill="#b4c7cd" font-size="27" font-weight="400" text-anchor="start">Two stereo mixes · 4 independent outputs</text><rect x="40" y="145" width="640" height="300" rx="18" fill="#142430" stroke="#304957" stroke-width="2"/><g transform="translate(555 174)" fill="none" stroke="#55deca" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="0" width="34" height="59" rx="5"/><rect x="52" y="0" width="34" height="59" rx="5"/><circle cx="19" cy="37" r="10"/><circle cx="69" cy="37" r="10"/><circle cx="19" cy="14" r="3"/><circle cx="69" cy="14" r="3"/></g><text x="64" y="191" fill="#55deca" font-size="29" font-weight="700" text-anchor="start">AUDIENCE</text><text x="64" y="238" fill="#f1f6f7" font-size="28" font-weight="700" text-anchor="start">Instruments + backing tracks</text><path d="M88 259v40" fill="none" stroke="#55deca" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#midi)"/><text x="64" y="337" fill="#f1f6f7" font-size="30" font-weight="700" text-anchor="start">Outputs 1/2 → mixer → PA</text><text x="64" y="401" fill="#55deca" font-size="27" font-weight="400" text-anchor="start">No click in this mix.</text><rect x="40" y="473" width="640" height="320" rx="18" fill="#142430" stroke="#304957" stroke-width="2"/><g transform="translate(555 502)" fill="none" stroke="#ffbd7a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 37v-8a36 36 0 0 1 72 0v8"/><rect x="5" y="29" width="18" height="32" rx="6"/><rect x="65" y="29" width="18" height="32" rx="6"/></g><text x="64" y="519" fill="#ffbd7a" font-size="29" font-weight="700" text-anchor="start">PERFORMERS</text><text x="64" y="566" fill="#f1f6f7" font-size="28" font-weight="700" text-anchor="start">Instruments + click</text><path d="M88 587v40" fill="none" stroke="#ffbd7a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#audio)"/><text x="64" y="665" fill="#f1f6f7" font-size="30" font-weight="700" text-anchor="start">Outputs 3/4 → headphone amp</text><text x="64" y="707" fill="#f1f6f7" font-size="30" font-weight="700" text-anchor="start">/ in-ear monitoring system</text><text x="64" y="759" fill="#ffbd7a" font-size="27" font-weight="400" text-anchor="start">Monitor mix separate from the PA.</text><text x="40" y="844" fill="#b4c7cd" font-size="26" font-weight="400" text-anchor="start">Build both mixes in the host; test each output.</text><text x="40" y="882" fill="#b4c7cd" font-size="26" font-weight="400" text-anchor="start">Headphones mirroring 1/2 are not another mix.</text>
</g>
</svg>
