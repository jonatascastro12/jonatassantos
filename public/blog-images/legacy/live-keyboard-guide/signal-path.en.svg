<svg xmlns="http://www.w3.org/2000/svg" width="720" height="950" viewBox="0 0 720 950" lang="en" role="img" aria-labelledby="title desc">
<title id="title">From touch to sound</title>
<desc id="desc">The keyboard sends MIDI to the computer, which sends digital audio to the interface; the interface sends analog audio to the mixer, PA and monitors.</desc>
<defs>
<marker id="midi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#55deca"/></marker>
<marker id="audio" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#ffbd7a"/></marker>
</defs>
<rect width="720" height="950" rx="24" fill="#0b1620"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="40" y="63" fill="#f1f6f7" font-size="40" font-weight="700" text-anchor="start">From touch to sound</text><text x="40" y="107" fill="#55deca" font-size="27" font-weight="700" text-anchor="start">MIDI = commands</text><text x="378" y="107" fill="#ffbd7a" font-size="27" font-weight="700" text-anchor="start">Audio = sound</text><rect x="40" y="145" width="640" height="138" rx="18" fill="#142430" stroke="#304957" stroke-width="2"/><g transform="translate(60 184)" fill="none" stroke="#55deca" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="10" width="88" height="42" rx="4"/><path d="M15 12v38m14-38v38m15-38v38m15-38v38m14-38v38"/><path d="M12 12v21m17-21v21m29-21v21m15-21v21" stroke-width="7"/></g><text x="176" y="184" fill="#55deca" font-size="23" font-weight="700" text-anchor="start">01</text><text x="176" y="223" fill="#f1f6f7" font-size="29" font-weight="700" text-anchor="start">Keyboard controller</text><text x="176" y="257" fill="#b4c7cd" font-size="26" font-weight="400" text-anchor="start">Notes, velocity and pedals</text><path d="M100 284v45" fill="none" stroke="#55deca" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#midi)"/><text x="135" y="321" fill="#55deca" font-size="26" font-weight="400" text-anchor="start">USB-MIDI / MIDI interface</text><rect x="40" y="342" width="640" height="138" rx="18" fill="#142430" stroke="#304957" stroke-width="2"/><g transform="translate(60 381)" fill="none" stroke="#ffbd7a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="0" width="74" height="49" rx="5"/><path d="M0 59h88M17 49l-6 10m60-10 6 10M18 15h20m-20 10h50m-50 10h36"/></g><text x="176" y="381" fill="#ffbd7a" font-size="23" font-weight="700" text-anchor="start">02</text><text x="176" y="420" fill="#f1f6f7" font-size="29" font-weight="700" text-anchor="start">Computer + host</text><text x="176" y="454" fill="#b4c7cd" font-size="26" font-weight="400" text-anchor="start">Virtual instrument + effects</text><path d="M100 481v45" fill="none" stroke="#ffbd7a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#audio)"/><text x="135" y="518" fill="#ffbd7a" font-size="26" font-weight="400" text-anchor="start">Digital audio · USB / Thunderbolt</text><rect x="40" y="539" width="640" height="138" rx="18" fill="#142430" stroke="#304957" stroke-width="2"/><g transform="translate(60 578)" fill="none" stroke="#ffbd7a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="4" width="88" height="50" rx="7"/><circle cx="22" cy="29" r="10"/><circle cx="55" cy="29" r="6"/><path d="M72 20v18M10 44h18"/></g><text x="176" y="578" fill="#ffbd7a" font-size="23" font-weight="700" text-anchor="start">03</text><text x="176" y="617" fill="#f1f6f7" font-size="29" font-weight="700" text-anchor="start">Audio interface</text><text x="176" y="651" fill="#b4c7cd" font-size="26" font-weight="400" text-anchor="start">Digital → analog conversion</text><path d="M100 678v45" fill="none" stroke="#ffbd7a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#audio)"/><text x="135" y="715" fill="#ffbd7a" font-size="26" font-weight="400" text-anchor="start">Analog audio · line cables</text><rect x="40" y="736" width="640" height="138" rx="18" fill="#142430" stroke="#304957" stroke-width="2"/><g transform="translate(60 775)" fill="none" stroke="#ffbd7a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="0" width="34" height="59" rx="5"/><rect x="52" y="0" width="34" height="59" rx="5"/><circle cx="19" cy="37" r="10"/><circle cx="69" cy="37" r="10"/><circle cx="19" cy="14" r="3"/><circle cx="69" cy="14" r="3"/></g><text x="176" y="775" fill="#ffbd7a" font-size="23" font-weight="700" text-anchor="start">04</text><text x="176" y="814" fill="#f1f6f7" font-size="29" font-weight="700" text-anchor="start">Mixer, PA and monitors</text><text x="176" y="848" fill="#b4c7cd" font-size="26" font-weight="400" text-anchor="start">The sound reaches the listeners</text><text x="40" y="921" fill="#b4c7cd" font-size="26" font-weight="400" text-anchor="start">The keyboard sends MIDI; the plugin makes audio.</text>
</g>
</svg>
